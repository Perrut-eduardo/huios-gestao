{% extends "base.html" %}
{% block titulo %}Entrar — HUIOS GESTÃO{% endblock %}
{% block conteudo %}
  <h1>Acessar gestão do CT</h1>
  <p class="descricao">Acesso exclusivo à equipe autorizada.</p>
  {% if form.errors %}<div class="alerta erro" role="alert">Usuário ou senha inválidos. Confira as informações e tente novamente.</div>{% endif %}
  <form method="post" class="cartao" novalidate>
    {% csrf_token %}
    <div class="campo"><label for="id_username">Usuário</label><input type="text" name="username" id="id_username" autocomplete="username" required maxlength="150"></div>
    <div class="campo"><label for="id_password">Senha</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primario" type="submit">Entrar</button>
  </form>
{% endblock %}
